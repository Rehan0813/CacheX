version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cachex_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/Backend/cachex.db
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - cachex_data:/app/Backend
    restart: unless-stopped

volumes:
  cachex_data:
